<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchify Admin</title>
<style>
  :root{ --bg:#0f0b12; --card:#1a141e; --card2:#211a26; --line:#2a2230; --text:#f2eef5; --dim:#a99cb3; --flame1:#FF5E7E; --flame2:#FF8A5C; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffc24b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  a{ color:inherit; }
  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-box{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; width:320px; }
  .login-box h1{ font-size:20px; margin:0 0 4px; }
  .login-box p{ color:var(--dim); font-size:13px; margin:0 0 20px; }
  .login-box input{ width:100%; padding:11px 13px; margin-bottom:10px; border-radius:10px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:14px; }
  .login-box button{ width:100%; padding:12px; border-radius:10px; background:linear-gradient(120deg,var(--flame1),var(--flame2)); color:#fff; font-weight:700; border:none; cursor:pointer; }
  .login-err{ color:var(--bad); font-size:12.5px; min-height:16px; margin-bottom:6px; }
  #app{ display:none; min-height:100vh; }
  #app.on{ display:flex; }
  nav{ width:200px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line); padding:18px 10px; display:flex; flex-direction:column; }
  nav h2{ font-size:16px; padding:0 10px 16px; margin:0; }
  nav .who{ font-size:11.5px; color:var(--dim); padding:0 10px 14px; }
  nav button{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:10px 10px; border-radius:10px; background:none; border:none; color:var(--dim); font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:2px; }
  nav button .badge{ margin-left:auto; background:var(--flame1); color:#fff; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:20px; }
  nav button.active{ background:var(--card2); color:var(--text); }
  nav .logout{ margin-top:auto; color:var(--bad); }
  main{ flex:1; padding:26px 30px; max-width:1100px; }
  main h1{ font-size:19px; margin:0 0 4px; }
  main .sub{ color:var(--dim); font-size:13px; margin-bottom:18px; }
  .filters{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filters button{ padding:6px 14px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--dim); font-size:12.5px; font-weight:700; cursor:pointer; }
  .filters button.sel{ background:var(--flame1); color:#fff; border-color:transparent; }
  .filters input{ padding:7px 12px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:12.5px; min-width:180px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .card img{ width:100%; height:230px; object-fit:cover; display:block; background:#000; }
  .card .body{ padding:12px 13px; }
  .card .name{ font-weight:700; font-size:13.5px; }
  .card .meta{ color:var(--dim); font-size:11.5px; margin-top:2px; }
  .card .row{ display:flex; gap:8px; margin-top:10px; }
  .card .row button{ flex:1; padding:8px; border-radius:9px; border:none; font-weight:700; font-size:12.5px; cursor:pointer; }
  .approve{ background:var(--ok); color:#062; }
  .reject{ background:var(--bad); color:#3a0000; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--dim); font-weight:600; font-size:11.5px; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:hover td{ background:var(--card2); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:800; }
  .pill.ok{ background:rgba(62,207,142,.18); color:var(--ok); }
  .pill.bad{ background:rgba(255,107,107,.18); color:var(--bad); }
  .pill.warn{ background:rgba(255,194,75,.18); color:var(--warn); }
  .pill.dim{ background:var(--card2); color:var(--dim); }
  .actbtn{ padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:12px; font-weight:700; cursor:pointer; margin-right:6px; }
  .actbtn.bad{ border-color:transparent; background:var(--bad); color:#3a0000; }
  .empty{ color:var(--dim); font-size:13.5px; padding:30px 0; text-align:center; }
  .loadmore{ margin:16px auto; display:block; padding:9px 20px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--text); cursor:pointer; }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#241d28; border:1px solid var(--line); padding:11px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:999; }
  .toast.show{ opacity:1; }
  .modal-bg{ position:fixed; inset:0; background:rgba(6,4,8,.7); display:none; align-items:center; justify-content:center; z-index:1000; }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; width:320px; }
  .modal h3{ margin:0 0 10px; font-size:16px; }
  .modal textarea{ width:100%; min-height:80px; padding:10px; border-radius:10px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:13px; }
  .modal .row{ display:flex; gap:8px; margin-top:12px; }
  .modal .row button{ flex:1; padding:10px; border-radius:9px; border:none; font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Matchify Admin</h1>
    <p>Moderator / admin sign-in</p>
    <div class="login-err" id="loginErr"></div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Sign in</button>
  </div>
</div>

<div id="app">
  <nav>
    <h2>Matchify</h2>
    <div class="who" id="whoAmI"></div>
    <button data-view="verifications" class="active">🪪 Verifications <span class="badge" id="badgeVer" style="display:none"></span></button>
    <button data-view="photos">🖼️ Photos <span class="badge" id="badgePhotos" style="display:none"></span></button>
    <button data-view="reports">🚩 Reports <span class="badge" id="badgeReports" style="display:none"></span></button>
    <button data-view="randomchat">💬 Random Chat</button>
    <button data-view="users">👤 Users</button>
    <button data-view="payments">💳 Payments</button>
    <button data-view="safety">🛡️ Safety</button>
    <button data-view="audit">📜 Audit Log</button>
    <button class="logout" id="logoutBtn">↩ Log out</button>
  </nav>
  <main id="main"></main>
</div>

<div class="modal-bg" id="reasonModalBg">
  <div class="modal">
    <h3 id="reasonModalTitle">Reject</h3>
    <textarea id="reasonModalText" placeholder="Reason (shown in the audit log)"></textarea>
    <div class="row"><button id="reasonCancel" style="background:var(--card2);color:var(--text);">Cancel</button><button id="reasonConfirm" class="reject" style="background:var(--bad);color:#3a0000;">Confirm</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const API_BASE = window.MATCHIFY_API_BASE || 'http://localhost:4000';

  async function apiFetch(path, options = {}){
    let res;
    try{
      res = await fetch(API_BASE + path, {
        method: options.method || 'GET',
        headers: { 'Content-Type': 'application/json', ...(options.headers||{}) },
        credentials: 'include', // sends the separate adminAccessToken cookie — never the regular user session
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
    }catch(networkErr){
      // See index.html's apiFetch for the full explanation: a bare "Failed
      // to fetch" here means the backend isn't reachable at API_BASE, CORS
      // (APP_ORIGIN) is blocking this page's origin, or https/http mixed
      // content was blocked — never an application error the server sent.
      const err = new Error(`Could not reach the server at ${API_BASE}${path}. Check that the backend is running there, CORS/APP_ORIGIN allows this page's origin, and http/https match.`);
      err.isNetworkError = true;
      throw err;
    }
    let json; try { json = await res.json(); } catch(e) { json = null; }
    if(!res.ok || !json || json.success === false){
      const err = new Error(json && json.error && json.error.message ? json.error.message : `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return json.data;
  }
  const Api = {
    login: (email,password) => apiFetch('/api/admin/auth/login', { method:'POST', body:{ email, password } }),
    logout: () => apiFetch('/api/admin/auth/logout', { method:'POST' }),
    me: () => apiFetch('/api/admin/auth/me'),
    verifications: (status, cursor) => apiFetch(`/api/admin/verifications?${qs({status,cursor})}`),
    approveVerification: id => apiFetch(`/api/admin/verifications/${id}/approve`, { method:'POST' }),
    rejectVerification: (id, reason) => apiFetch(`/api/admin/verifications/${id}/reject`, { method:'POST', body:{ reason } }),
    photos: (status, cursor) => apiFetch(`/api/admin/photos?${qs({status,cursor})}`),
    approvePhoto: id => apiFetch(`/api/admin/photos/${id}/approve`, { method:'POST' }),
    rejectPhoto: (id, reason) => apiFetch(`/api/admin/photos/${id}/reject`, { method:'POST', body:{ reason } }),
    reports: (status, cursor) => apiFetch(`/api/admin/reports?${qs({status,cursor})}`),
    updateReportStatus: (id, status) => apiFetch(`/api/admin/reports/${id}`, { method:'PATCH', body:{ status } }),
    suspendReported: (id, reason) => apiFetch(`/api/admin/reports/${id}/suspend-reported`, { method:'POST', body:{ reason } }),
    users: (params, cursor) => apiFetch(`/api/admin/users?${qs({...params,cursor})}`),
    userDetail: id => apiFetch(`/api/admin/users/${id}`),
    suspendUser: (id, reason) => apiFetch(`/api/admin/users/${id}/suspend`, { method:'POST', body:{ reason } }),
    restoreUser: id => apiFetch(`/api/admin/users/${id}/restore`, { method:'POST' }),
    payments: (status, cursor) => apiFetch(`/api/admin/payments?${qs({status,cursor})}`),
    subscriptions: (status, cursor) => apiFetch(`/api/admin/subscriptions?${qs({status,cursor})}`),
    blocks: cursor => apiFetch(`/api/admin/safety/blocks?${qs({cursor})}`),
    flagged: cursor => apiFetch(`/api/admin/safety/flagged-users?${qs({cursor})}`),
    auditLogs: cursor => apiFetch(`/api/admin/audit-logs?${qs({cursor})}`),
  };
  function qs(o){ return Object.entries(o).filter(([,v])=>v).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&'); }
  function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
  function fmt(dt){ return dt ? new Date(dt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : ''; }

  let toastTimer;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.classList.remove('show'), 2600);
  }

  let me = null;
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginErr');
    err.textContent = '';
    try{
      const data = await Api.login(email, password);
      me = data.admin;
      boot();
    }catch(e){ err.textContent = e.message || 'Login failed.'; }
  }
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    try{ await Api.logout(); }catch(e){}
    location.reload();
  });

  // Try an existing admin session before showing the login form.
  (async ()=>{
    try{ const data = await Api.me(); me = data.admin; boot(); }
    catch(e){ /* not logged in — show login screen (already visible by default) */ }
  })();

  function boot(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('on');
    document.getElementById('whoAmI').textContent = `${me.email} · ${me.role}`;
    if(me.role !== 'ADMIN'){
      // Suspend/restore/suspend-reported are ADMIN-only server-side; hide
      // the controls for MODERATOR so a 403 isn't the first thing they see.
      document.documentElement.classList.add('moderator');
    }
    document.querySelectorAll('nav button[data-view]').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.view)));
    setView('verifications');
    refreshBadges();
  }

  async function refreshBadges(){
    try{
      const v = await Api.verifications('MANUAL_REVIEW');
      setBadge('badgeVer', v.sessions.length);
    }catch(e){}
    try{
      const p = await Api.photos();
      setBadge('badgePhotos', p.photos.length);
    }catch(e){}
    try{
      const r = await Api.reports('OPEN');
      setBadge('badgeReports', r.reports.length);
    }catch(e){}
  }
  function setBadge(id, n){
    const el = document.getElementById(id);
    if(n > 0){ el.textContent = n; el.style.display = ''; } else el.style.display = 'none';
  }

  function setView(view){
    document.querySelectorAll('nav button[data-view]').forEach(b=> b.classList.toggle('active', b.dataset.view === view));
    const renderers = { randomchat:renderRandomChat, verifications:renderVerifications, photos:renderPhotos, reports:renderReports, users:renderUsers, payments:renderPayments, safety:renderSafety, audit:renderAudit };
    renderers[view]();
  }

  function reasonPrompt(title){
    return new Promise(resolve=>{
      const bg = document.getElementById('reasonModalBg');
      document.getElementById('reasonModalTitle').textContent = title;
      document.getElementById('reasonModalText').value = '';
      bg.classList.add('open');
      const cancel = document.getElementById('reasonCancel');
      const confirm = document.getElementById('reasonConfirm');
      function close(v){ bg.classList.remove('open'); cancel.onclick = null; confirm.onclick = null; resolve(v); }
      cancel.onclick = ()=> close(null);
      confirm.onclick = ()=> close(document.getElementById('reasonModalText').value.trim());
    });
  }

  // ---------------- Verifications ----------------
  async function renderVerifications(status){
    status = status || 'MANUAL_REVIEW';
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Identity verifications</h1><div class="sub">Selfie-based reviews and Stripe Identity sessions awaiting a decision.</div>
      <div class="filters">${['MANUAL_REVIEW','PENDING','PROCESSING','VERIFIED','REJECTED'].map(s=>`<button data-s="${s}" class="${s===status?'sel':''}">${s.replace('_',' ')}</button>`).join('')}</div>
      <div class="grid" id="verGrid"></div><button class="loadmore" id="verMore" style="display:none;">Load more</button>`;
    main.querySelectorAll('[data-s]').forEach(b=> b.addEventListener('click', ()=> renderVerifications(b.dataset.s)));
    await loadVerifications(status, null, false);
  }
  async function loadVerifications(status, cursor, append){
    const grid = document.getElementById('verGrid');
    try{
      const data = await Api.verifications(status, cursor);
      if(!append) grid.innerHTML = '';
      if(!data.sessions.length && !append) grid.innerHTML = '<div class="empty">Nothing here.</div>';
      data.sessions.forEach(sess=>{
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `
          ${sess.selfieUrl ? `<img src="${esc(sess.selfieUrl)}" alt="selfie">` : `<div style="height:230px;display:flex;align-items:center;justify-content:center;color:var(--dim);background:var(--card2);">No image (${esc(sess.provider)})</div>`}
          <div class="body">
            <div class="name">${esc(sess.user ? sess.user.email : sess.userId)}</div>
            <div class="meta">${esc(sess.provider)} · ${fmt(sess.createdAt)}</div>
            ${status==='MANUAL_REVIEW' || status==='PENDING' || status==='PROCESSING' ? `<div class="row"><button class="approve" data-approve="${sess.id}">Approve</button><button class="reject" data-reject="${sess.id}">Reject</button></div>` : ''}
          </div>`;
        grid.appendChild(card);
      });
      grid.querySelectorAll('[data-approve]').forEach(b=> b.addEventListener('click', async ()=>{
        try{ await Api.approveVerification(b.dataset.approve); toast('Verified ✓'); renderVerifications(status); refreshBadges(); }
        catch(e){ toast(e.message); }
      }));
      grid.querySelectorAll('[data-reject]').forEach(b=> b.addEventListener('click', async ()=>{
        const reason = await reasonPrompt('Reject verification'); if(reason === null) return;
        try{ await Api.rejectVerification(b.dataset.reject, reason); toast('Rejected'); renderVerifications(status); refreshBadges(); }
        catch(e){ toast(e.message); }
      }));
      const more = document.getElementById('verMore');
      if(data.nextCursor){ more.style.display=''; more.onclick = ()=> loadVerifications(status, data.nextCursor, true); }
      else more.style.display = 'none';
    }catch(e){ grid.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  // ---------------- Photos ----------------
  async function renderPhotos(status){
    status = status || '';
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Photo moderation</h1><div class="sub">Profile photos pending review or already decided.</div>
      <div class="filters">${['','PENDING','MANUAL_REVIEW','APPROVED','REJECTED'].map(s=>`<button data-s="${s}" class="${s===status?'sel':''}">${s||'Queue'}</button>`).join('')}</div>
      <div class="grid" id="photoGrid"></div><button class="loadmore" id="photoMore" style="display:none;">Load more</button>`;
    main.querySelectorAll('[data-s]').forEach(b=> b.addEventListener('click', ()=> renderPhotos(b.dataset.s)));
    await loadPhotos(status, null, false);
  }
  async function loadPhotos(status, cursor, append){
    const grid = document.getElementById('photoGrid');
    try{
      const data = await Api.photos(status || undefined, cursor);
      if(!append) grid.innerHTML = '';
      if(!data.photos.length && !append) grid.innerHTML = '<div class="empty">Nothing here.</div>';
      data.photos.forEach(photo=>{
        const card = document.createElement('div'); card.className = 'card';
        const pending = photo.status === 'PENDING' || photo.status === 'MANUAL_REVIEW';
        card.innerHTML = `
          <img src="${esc(photo.viewUrl)}" alt="photo">
          <div class="body">
            <div class="name">${esc(photo.user ? photo.user.email : photo.userId)}</div>
            <div class="meta"><span class="pill ${photo.status==='APPROVED'?'ok':photo.status==='REJECTED'?'bad':'warn'}">${esc(photo.status)}</span> · ${fmt(photo.createdAt)}</div>
            ${pending ? `<div class="row"><button class="approve" data-approve="${photo.id}">Approve</button><button class="reject" data-reject="${photo.id}">Reject</button></div>` : ''}
          </div>`;
        grid.appendChild(card);
      });
      grid.querySelectorAll('[data-approve]').forEach(b=> b.addEventListener('click', async ()=>{
        try{ await Api.approvePhoto(b.dataset.approve); toast('Photo approved'); renderPhotos(status); refreshBadges(); }
        catch(e){ toast(e.message); }
      }));
      grid.querySelectorAll('[data-reject]').forEach(b=> b.addEventListener('click', async ()=>{
        const reason = await reasonPrompt('Reject photo'); if(reason === null) return;
        try{ await Api.rejectPhoto(b.dataset.reject, reason); toast('Photo rejected'); renderPhotos(status); refreshBadges(); }
        catch(e){ toast(e.message); }
      }));
      const more = document.getElementById('photoMore');
      if(data.nextCursor){ more.style.display=''; more.onclick = ()=> loadPhotos(status, data.nextCursor, true); }
      else more.style.display = 'none';
    }catch(e){ grid.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  // ---------------- Reports ----------------
  async function renderReports(status){
    status = status || 'OPEN';
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Reports</h1><div class="sub">User, photo, and message reports.</div>
      <div class="filters">${['OPEN','INVESTIGATING','RESOLVED','DISMISSED'].map(s=>`<button data-s="${s}" class="${s===status?'sel':''}">${s}</button>`).join('')}</div>
      <table><thead><tr><th>Reporter</th><th>Reported</th><th>Reason</th><th>Status</th><th>When</th><th></th></tr></thead><tbody id="repBody"></tbody></table>
      <button class="loadmore" id="repMore" style="display:none;">Load more</button>`;
    main.querySelectorAll('[data-s]').forEach(b=> b.addEventListener('click', ()=> renderReports(b.dataset.s)));
    await loadReports(status, null, false);
  }
  async function loadReports(status, cursor, append){
    const body = document.getElementById('repBody');
    try{
      const data = await Api.reports(status, cursor);
      if(!append) body.innerHTML = '';
      if(!data.reports.length && !append) body.innerHTML = '<tr><td colspan="6" class="empty">Nothing here.</td></tr>';
      data.reports.forEach(r=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${esc(r.reporter ? r.reporter.email : r.reporterId)}</td>
          <td>${esc(r.reported ? r.reported.email : r.reportedId)} ${r.reported && r.reported.status==='SUSPENDED' ? '<span class="pill bad">SUSPENDED</span>' : ''}</td>
          <td>${esc(r.reason)}</td>
          <td><span class="pill ${r.status==='RESOLVED'?'ok':r.status==='DISMISSED'?'dim':'warn'}">${esc(r.status)}</span></td>
          <td>${fmt(r.createdAt)}</td>
          <td>
            <select class="statusSel" style="background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px;">
              ${['OPEN','INVESTIGATING','RESOLVED','DISMISSED'].map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s}</option>`).join('')}
            </select>
            <button class="actbtn bad" data-suspend="${r.id}">Suspend user</button>
          </td>`;
        tr.querySelector('.statusSel').addEventListener('change', async e=>{
          try{ await Api.updateReportStatus(r.id, e.target.value); toast('Report updated'); refreshBadges(); }
          catch(err){ toast(err.message); }
        });
        tr.querySelector('[data-suspend]').addEventListener('click', async ()=>{
          const reason = await reasonPrompt(`Suspend ${r.reported ? r.reported.email : 'this user'}`); if(reason === null) return;
          try{ await Api.suspendReported(r.id, reason); toast('User suspended'); renderReports(status); }
          catch(err){ toast(err.message); }
        });
        body.appendChild(tr);
      });
      const more = document.getElementById('repMore');
      if(data.nextCursor){ more.style.display=''; more.onclick = ()=> loadReports(status, data.nextCursor, true); }
      else more.style.display = 'none';
    }catch(e){ body.innerHTML = `<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`; }
  }


  // ---------------- Random Chat ----------------
  const rcQs = (o) => qs(o);
  const RcApi = {
    stats: () => apiFetch('/api/admin/random-chat/stats'),
    sessions: (cursor) => apiFetch(`/api/admin/random-chat/sessions?${rcQs({cursor})}`),
    endSession: id => apiFetch(`/api/admin/random-chat/sessions/${id}/end`, { method:'POST' }),
    alerts: (resolved, cursor) => apiFetch(`/api/admin/random-chat/alerts?${rcQs({resolved: resolved ? 'true' : '', cursor})}`),
    resolveAlert: id => apiFetch(`/api/admin/random-chat/alerts/${id}/resolve`, { method:'POST' }),
    reports: (status, cursor) => apiFetch(`/api/admin/random-chat/reports?${rcQs({status,cursor})}`),
    reportMessages: id => apiFetch(`/api/admin/random-chat/reports/${id}/messages`),
    bans: () => apiFetch('/api/admin/random-chat/bans'),
    review: id => apiFetch(`/api/admin/random-chat/users/${id}/review`),
    ban: (id, reason, hours) => apiFetch(`/api/admin/random-chat/users/${id}/ban`, { method:'POST', body:{ reason, hours } }),
    unban: id => apiFetch(`/api/admin/random-chat/users/${id}/unban`, { method:'POST' }),
  };
  function mmss(sec){ const m = Math.floor(sec/60), s = sec%60; return `${m}m ${String(s).padStart(2,'0')}s`; }

  async function renderRandomChat(){
    const main = document.getElementById('main');
    const isAdmin = me && me.role === 'ADMIN';
    main.innerHTML = `<h1>Random Chat</h1><div class="sub">Live state, abuse alerts, reports, bans. Message content is not shown here.</div>
      <div class="grid" id="rcStats" style="margin-bottom:18px;"></div>
      <h2 style="font-size:15px;margin:18px 0 8px;">Abuse alerts</h2>
      <table><thead><tr><th>User</th><th>Type</th><th>Detail</th><th>When</th><th></th></tr></thead><tbody id="rcAlerts"></tbody></table>
      <h2 style="font-size:15px;margin:22px 0 8px;">Random Chat reports</h2>
      <table><thead><tr><th>Reporter</th><th>Reported</th><th>Reason</th><th>Details</th><th>Status</th><th>When</th><th></th></tr></thead><tbody id="rcReports"></tbody></table>
      <h2 style="font-size:15px;margin:22px 0 8px;">Active sessions</h2>
      <table><thead><tr><th>Session</th><th>Started</th><th>Messages</th><th></th></tr></thead><tbody id="rcSessions"></tbody></table>
      <h2 style="font-size:15px;margin:22px 0 8px;">Banned from Random Chat</h2>
      <table><thead><tr><th>User</th><th>Reason</th><th>Until</th><th>Type</th><th></th></tr></thead><tbody id="rcBans"></tbody></table>`;
    await Promise.all([rcLoadStats(), rcLoadAlerts(), rcLoadReports(), rcLoadSessions(), rcLoadBans(isAdmin)]);
  }
  async function rcLoadStats(){
    const box = document.getElementById('rcStats');
    try{
      const s = await RcApi.stats();
      const tiles = [
        ['Online users', s.onlineUsers], ['Waiting', s.waitingUsers], ['Active sessions', s.activeSessions],
        ['Avg session (24h)', mmss(s.avgSessionSeconds24h)], ['Sessions (24h)', s.sessions24h], ['Open RC reports', s.openReports],
        ['Blocks (24h)', s.blocks24h], ['Open alerts', s.openAlerts], ['Active bans', s.activeBans],
      ];
      box.innerHTML = tiles.map(([k,v]) => `<div class="card"><div class="body"><div class="meta">${esc(k)}</div><div style="font-size:26px;font-weight:800;margin-top:4px;">${esc(String(v))}</div></div></div>`).join('');
    }catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  async function rcLoadAlerts(){
    const body = document.getElementById('rcAlerts');
    try{
      const d = await RcApi.alerts(false);
      body.innerHTML = d.alerts.length ? '' : '<tr><td colspan="5" class="empty">No open alerts.</td></tr>';
      d.alerts.forEach(a => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(a.user ? a.user.email : a.userId)}${a.user && a.user.status==='SUSPENDED' ? ' <span class="pill bad">SUSPENDED</span>' : ''}</td>
          <td><span class="pill warn">${esc(a.type)}</span></td><td>${esc(a.detail||'')}</td><td>${fmt(a.createdAt)}</td>
          <td><button class="actbtn" data-review>Review user</button>${me.role==='ADMIN'?'<button class="actbtn bad" data-ban>Ban from RC</button>':''}<button class="actbtn" data-resolve>Resolve</button></td>`;
        tr.querySelector('[data-review]').addEventListener('click', () => rcReviewUser(a.userId));
        const ban = tr.querySelector('[data-ban]'); if(ban) ban.addEventListener('click', () => rcBan(a.userId, a.user && a.user.email));
        tr.querySelector('[data-resolve]').addEventListener('click', async () => { try{ await RcApi.resolveAlert(a.id); toast('Alert resolved'); rcLoadAlerts(); rcLoadStats(); }catch(e){ toast(e.message); } });
        body.appendChild(tr);
      });
    }catch(e){ body.innerHTML = `<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`; }
  }
  async function rcLoadReports(){
    const body = document.getElementById('rcReports');
    try{
      const d = await RcApi.reports('OPEN');
      body.innerHTML = d.reports.length ? '' : '<tr><td colspan="7" class="empty">No open Random Chat reports.</td></tr>';
      d.reports.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(r.reporter ? r.reporter.email : '')}</td><td>${esc(r.reported ? r.reported.email : '')}</td><td>${esc(r.reason)}</td>
          <td>${esc(r.description||'')}</td><td><span class="pill warn">${esc(r.status)}</span></td><td>${fmt(r.createdAt)}</td>
          <td><button class="actbtn" data-review>Review user</button>${me.role==='ADMIN'?'<button class="actbtn" data-msgs>View chat</button>':''}
          <select class="statusSel" style="background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px;">${['OPEN','INVESTIGATING','RESOLVED','DISMISSED'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>`;
        tr.querySelector('[data-review]').addEventListener('click', () => rcReviewUser(r.reportedId));
        const m = tr.querySelector('[data-msgs]');
        if(m) m.addEventListener('click', async () => {
          try{
            const x = await RcApi.reportMessages(r.id);
            alert(x.messages.map(i => `${i.fromReporter ? 'Reporter' : 'Reported'} (${fmt(i.createdAt)}): ${i.content}`).join('\n') || 'No messages.');
          }catch(e){ toast(e.message); }
        });
        tr.querySelector('.statusSel').addEventListener('change', async e => { try{ await Api.updateReportStatus(r.id, e.target.value); toast('Report updated'); rcLoadReports(); rcLoadStats(); }catch(err){ toast(err.message); } });
        body.appendChild(tr);
      });
    }catch(e){ body.innerHTML = `<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`; }
  }
  async function rcLoadSessions(){
    const body = document.getElementById('rcSessions');
    try{
      const d = await RcApi.sessions();
      body.innerHTML = d.sessions.length ? '' : '<tr><td colspan="4" class="empty">No active sessions.</td></tr>';
      d.sessions.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="font-family:monospace;font-size:12px;">${esc(s.id)}</td><td>${fmt(s.startedAt)}</td><td>${s.messageCount}</td><td><button class="actbtn bad">End session</button></td>`;
        tr.querySelector('button').addEventListener('click', async () => { try{ await RcApi.endSession(s.id); toast('Session ended'); rcLoadSessions(); rcLoadStats(); }catch(e){ toast(e.message); } });
        body.appendChild(tr);
      });
    }catch(e){ body.innerHTML = `<tr><td colspan="4" class="empty">${esc(e.message)}</td></tr>`; }
  }
  async function rcLoadBans(isAdmin){
    const body = document.getElementById('rcBans');
    try{
      const d = await RcApi.bans();
      body.innerHTML = d.bans.length ? '' : '<tr><td colspan="5" class="empty">No active bans.</td></tr>';
      d.bans.forEach(b => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(b.user ? b.user.email : b.userId)}</td><td>${esc(b.reason)}</td><td>${b.until ? fmt(b.until) : 'Permanent'}</td><td>${b.auto ? '<span class="pill warn">AUTO</span>' : 'Manual'}</td><td>${isAdmin ? '<button class="actbtn">Unban</button>' : ''}</td>`;
        const btn = tr.querySelector('button');
        if(btn) btn.addEventListener('click', async () => { try{ await RcApi.unban(b.userId); toast('Unbanned'); rcLoadBans(isAdmin); rcLoadStats(); }catch(e){ toast(e.message); } });
        body.appendChild(tr);
      });
    }catch(e){ body.innerHTML = `<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`; }
  }
  async function rcBan(userId, email){
    const reason = await reasonPrompt(`Ban ${email || 'user'} from Random Chat`); if(!reason) return;
    const h = prompt('Duration in hours (leave blank for permanent):', '72');
    const hours = h && h.trim() ? parseInt(h, 10) : undefined;
    try{ await RcApi.ban(userId, reason, hours); toast('User banned from Random Chat'); renderRandomChat(); }catch(e){ toast(e.message); }
  }
  async function rcReviewUser(userId){
    try{
      const r = await RcApi.review(userId);
      alert(`${r.user.email}\nAccount: ${r.user.status} · Verification: ${r.user.verificationStatus}\nJoined: ${fmt(r.user.createdAt)}\n\nReports against: ${r.reportsAgainst}\nReports filed: ${r.reportsBy}\nBlocked by: ${r.blocksReceived} users\nChats (30d): ${r.sessions30d}\nRandom Chat ban: ${r.ban ? (r.ban.until ? 'until ' + fmt(r.ban.until) : 'permanent') + ' — ' + r.ban.reason : 'none'}\n\nRecent alerts:\n${r.alerts.map(a => `• ${a.type} (${fmt(a.createdAt)})${a.resolvedAt ? ' ✓' : ''}`).join('\n') || 'none'}\n\nUse the Users tab to suspend the whole account.`);
    }catch(e){ toast(e.message); }
  }

  // ---------------- Users ----------------
  async function renderUsers(){
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Users</h1><div class="sub">Search, review, suspend or restore accounts.</div>
      <div class="filters"><input id="userSearch" placeholder="Search by name or email…"></div>
      <table><thead><tr><th>Email</th><th>Status</th><th>Verification</th><th>Joined</th><th></th></tr></thead><tbody id="userBody"></tbody></table>
      <button class="loadmore" id="userMore" style="display:none;">Load more</button>`;
    let searchTimer;
    document.getElementById('userSearch').addEventListener('input', e=>{
      clearTimeout(searchTimer);
      searchTimer = setTimeout(()=> loadUsers(e.target.value.trim(), null, false), 350);
    });
    await loadUsers('', null, false);
  }
  async function loadUsers(query, cursor, append){
    const body = document.getElementById('userBody');
    try{
      const data = await Api.users({ query }, cursor);
      if(!append) body.innerHTML = '';
      if(!data.users.length && !append) body.innerHTML = '<tr><td colspan="5" class="empty">No users found.</td></tr>';
      data.users.forEach(u=>{
        const tr = document.createElement('tr');
        const suspended = u.status === 'SUSPENDED';
        tr.innerHTML = `
          <td>${esc(u.email)}</td>
          <td><span class="pill ${u.status==='ACTIVE'?'ok':u.status==='SUSPENDED'?'bad':'dim'}">${esc(u.status)}</span></td>
          <td><span class="pill ${u.verificationStatus==='VERIFIED'?'ok':'dim'}">${esc(u.verificationStatus)}</span></td>
          <td>${fmt(u.createdAt)}</td>
          <td>${suspended
            ? `<button class="actbtn" data-restore="${u.id}">Restore</button>`
            : `<button class="actbtn bad" data-suspend="${u.id}">Suspend</button>`}</td>`;
        const s = tr.querySelector('[data-suspend]');
        if(s) s.addEventListener('click', async ()=>{
          const reason = await reasonPrompt(`Suspend ${u.email}`); if(reason === null) return;
          try{ await Api.suspendUser(u.id, reason); toast('User suspended'); renderUsers(); }
          catch(e){ toast(e.message); }
        });
        const r = tr.querySelector('[data-restore]');
        if(r) r.addEventListener('click', async ()=>{
          try{ await Api.restoreUser(u.id); toast('User restored'); renderUsers(); }
          catch(e){ toast(e.message); }
        });
        body.appendChild(tr);
      });
      const more = document.getElementById('userMore');
      if(data.nextCursor){ more.style.display=''; more.onclick = ()=> loadUsers(query, data.nextCursor, true); }
      else more.style.display = 'none';
    }catch(e){ body.innerHTML = `<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`; }
  }

  // ---------------- Payments ----------------
  async function renderPayments(){
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Payments &amp; subscriptions</h1><div class="sub">Read-only — Razorpay is the source of truth for money movement.</div>
      <h3 style="margin:22px 0 8px;font-size:14px;">Recent payments</h3>
      <table><thead><tr><th>User</th><th>Amount</th><th>Status</th><th>When</th></tr></thead><tbody id="payBody"></tbody></table>
      <h3 style="margin:26px 0 8px;font-size:14px;">Subscriptions</h3>
      <table><thead><tr><th>User</th><th>Plan</th><th>Status</th><th>Expires</th></tr></thead><tbody id="subBody"></tbody></table>`;
    try{
      const p = await Api.payments();
      document.getElementById('payBody').innerHTML = p.payments.length ? p.payments.map(x=>`
        <tr><td>${esc(x.user ? x.user.email : x.userId)}</td><td>${(x.amount/100).toFixed(2)} ${esc(x.currency)}</td>
        <td><span class="pill ${x.status==='PAID'?'ok':x.status==='FAILED'?'bad':x.status==='REFUNDED'?'warn':'dim'}">${esc(x.status)}</span></td>
        <td>${fmt(x.createdAt)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No payments yet.</td></tr>';
    }catch(e){ document.getElementById('payBody').innerHTML = `<tr><td colspan="4" class="empty">${esc(e.message)}</td></tr>`; }
    try{
      const s = await Api.subscriptions();
      document.getElementById('subBody').innerHTML = s.subscriptions.length ? s.subscriptions.map(x=>`
        <tr><td>${esc(x.user ? x.user.email : x.userId)}</td><td>${esc(x.plan)}</td>
        <td><span class="pill ${x.status==='ACTIVE'?'ok':'dim'}">${esc(x.status)}</span></td>
        <td>${fmt(x.endDate)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No subscriptions yet.</td></tr>';
    }catch(e){ document.getElementById('subBody').innerHTML = `<tr><td colspan="4" class="empty">${esc(e.message)}</td></tr>`; }
  }

  // ---------------- Safety ----------------
  async function renderSafety(){
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Safety overview</h1><div class="sub">Blocks between users and accounts with multiple reports against them.</div>
      <h3 style="margin:22px 0 8px;font-size:14px;">Recent blocks</h3>
      <table><thead><tr><th>Blocker</th><th>Blocked</th><th>When</th></tr></thead><tbody id="blockBody"></tbody></table>
      <h3 style="margin:26px 0 8px;font-size:14px;">Flagged users (2+ reports)</h3>
      <table><thead><tr><th>User</th><th>Report count</th></tr></thead><tbody id="flagBody"></tbody></table>`;
    try{
      const b = await Api.blocks();
      document.getElementById('blockBody').innerHTML = b.blocks.length ? b.blocks.map(x=>`
        <tr><td>${esc(x.blocker ? x.blocker.email : x.blockerId)}</td><td>${esc(x.blocked ? x.blocked.email : x.blockedId)}</td><td>${fmt(x.createdAt)}</td></tr>`).join('')
        : '<tr><td colspan="3" class="empty">No blocks yet.</td></tr>';
    }catch(e){ document.getElementById('blockBody').innerHTML = `<tr><td colspan="3" class="empty">${esc(e.message)}</td></tr>`; }
    try{
      const f = await Api.flagged();
      document.getElementById('flagBody').innerHTML = f.users.length ? f.users.map(x=>`
        <tr><td>${esc(x.email)}</td><td>${esc(x.reportCount)}</td></tr>`).join('')
        : '<tr><td colspan="2" class="empty">No flagged users.</td></tr>';
    }catch(e){ document.getElementById('flagBody').innerHTML = `<tr><td colspan="2" class="empty">${esc(e.message)}</td></tr>`; }
  }

  // ---------------- Audit log ----------------
  async function renderAudit(){
    const main = document.getElementById('main');
    main.innerHTML = `<h1>Audit log</h1><div class="sub">Every admin/moderator action, including your own.</div>
      <table><thead><tr><th>Admin</th><th>Action</th><th>Target</th><th>When</th></tr></thead><tbody id="auditBody"></tbody></table>
      <button class="loadmore" id="auditMore" style="display:none;">Load more</button>`;
    await loadAudit(null, false);
  }
  async function loadAudit(cursor, append){
    const body = document.getElementById('auditBody');
    try{
      const data = await Api.auditLogs(cursor);
      if(!append) body.innerHTML = '';
      if(!data.logs.length && !append) body.innerHTML = '<tr><td colspan="4" class="empty">No actions logged yet.</td></tr>';
      data.logs.forEach(l=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(l.adminUser ? l.adminUser.email : l.adminUserId)}</td><td>${esc(l.action)}</td><td>${esc(l.targetType)} · ${esc(l.targetId)}</td><td>${fmt(l.createdAt)}</td>`;
        body.appendChild(tr);
      });
      const more = document.getElementById('auditMore');
      if(data.nextCursor){ more.style.display=''; more.onclick = ()=> loadAudit(data.nextCursor, true); }
      else more.style.display = 'none';
    }catch(e){ body.innerHTML = `<tr><td colspan="4" class="empty">${esc(e.message)}</td></tr>`; }
  }
})();
</script>
</body>
</html>
